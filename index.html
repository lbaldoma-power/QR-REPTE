<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Repte 3 | La ment matemàtica</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#172033;font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center;padding:22px 12px}.wrap{width:min(100%,520px);text-align:center}h1{font-size:clamp(21px,5vw,29px);margin:4px 0 12px}p{line-height:1.5}.timer{font-size:28px;font-weight:800;margin:12px auto;color:#145da0}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:min(94vw,420px);aspect-ratio:1;margin:18px auto;border:3px solid #111827;background:white}.cell{width:100%;height:100%;min-width:0;min-height:0;border:0;border-right:1px solid #8993a3;border-bottom:1px solid #8993a3;border-radius:0;text-align:center;font-size:clamp(19px,5vw,30px);font-weight:600;background:white;color:#145da0;appearance:none;padding:0}.cell:nth-child(6n){border-right:0}.cell:nth-child(n+31){border-bottom:0}.cell:nth-child(3n):not(:nth-child(6n)){border-right:3px solid #111827}.cell:nth-child(n+13):nth-child(-n+18),.cell:nth-child(n+25):nth-child(-n+30){border-bottom:3px solid #111827}.fixed{background:#edf1f5;color:#101827}.cell:focus{outline:3px solid #3297e0;outline-offset:-3px;position:relative;z-index:1}button{border:0;border-radius:10px;background:#135ca0;color:white;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{font-weight:650;min-height:50px;margin-top:16px}.note{font-size:13px;color:#566173}</style></head><body><main class="wrap"><h1>REPTE 3 | LA MENT MATEMÀTICA</h1><p>Completa amb els nombres de l’1 al 6, sense repetir-los en cada fila, columna ni rectangle de 2 × 3.</p><div class="timer" id="timer" aria-live="off">02:00</div><div id="grid" class="grid" role="group" aria-label="Sudoku de sis per sis"></div><button id="check">Comprovar resposta</button><p id="status" aria-live="polite"></p><p class="note">El temps comença automàticament quan s’obre el repte. Tens una única partida de 2 minuts en aquesta pestanya.</p></main><script>const puzzle=[[1,0,0,4,0,6],[0,5,6,0,2,0],[2,0,4,0,6,0],[0,6,0,2,0,4],[3,0,5,0,1,0],[0,1,0,3,0,5]];const answer=[[1,2,3,4,5,6],[4,5,6,1,2,3],[2,3,4,5,6,1],[5,6,1,2,3,4],[3,4,5,6,1,2],[6,1,2,3,4,5]];const grid=document.getElementById('grid'),status=document.getElementById('status'),timer=document.getElementById('timer'),check=document.getElementById('check');let finished=false;for(let r=0;r<6;r++)for(let c=0;c<6;c++){let inp=document.createElement('input');inp.className='cell'+(puzzle[r][c]?' fixed':'');inp.setAttribute('aria-label',`Fila ${r+1}, columna ${c+1}`);inp.setAttribute('inputmode','numeric');inp.setAttribute('maxlength','1');inp.dataset.r=r;inp.dataset.c=c;if(puzzle[r][c]){inp.value=puzzle[r][c];inp.readOnly=true;inp.tabIndex=-1}else{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^1-6]/g,'').slice(-1)})}grid.appendChild(inp)}const start=Date.now();function stop(message){finished=true;document.querySelectorAll('.cell').forEach(el=>el.readOnly=true);check.disabled=true;status.textContent=message}function tick(){if(finished)return;let remaining=Math.max(0,120-Math.floor((Date.now()-start)/1000));timer.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(!remaining){stop('Temps esgotat! Repte no superat.');clearInterval(interval)}}const interval=setInterval(tick,200);tick();check.addEventListener('click',()=>{if(finished)return;let correct=[...grid.children].every(el=>Number(el.value)===answer[Number(el.dataset.r)][Number(el.dataset.c)]);if(correct){stop('🎉 Repte superat! 2 punts per al teu equip.');clearInterval(interval)}else{status.textContent='Encara hi ha caselles buides o incorrectes. Torna-ho a provar mentre quedi temps.'}});</script></body></html>
