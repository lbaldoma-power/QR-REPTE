<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Repte 3 - Sudoku 6x6</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#182237;margin:0;padding:18px;text-align:center}main{max-width:520px;margin:auto}h1{font-size:23px}#timer{font-size:32px;font-weight:bold;color:#075ca0;margin:12px}table{border-collapse:collapse;table-layout:fixed;width:min(94vw,390px);height:min(94vw,390px);margin:16px auto;border:4px solid #1b2535;background:white}td{width:16.666%;height:16.666%;padding:0;border:1px solid #8a95a5}td:nth-child(3){border-right:4px solid #1b2535}tr:nth-child(2) td,tr:nth-child(4) td{border-bottom:4px solid #1b2535}input{box-sizing:border-box;display:block;width:100%;height:100%;min-width:0;border:0;border-radius:0;background:white;color:#075ca0;font-size:clamp(18px,6vw,30px);text-align:center;padding:0}input.fixed{background:#e9eef4;color:#152136;font-weight:bold}button{background:#075ca0;color:white;border:0;border-radius:9px;padding:13px 20px;font-size:17px;font-weight:bold}#status{font-weight:bold;min-height:48px}small{color:#526071}</style></head><body><main><h1>REPTE 3 · LA MENT MATEMÀTICA</h1><p>Sudoku de <b>6 files × 6 columnes</b>. Completa amb els números de l'1 al 6 sense repetir-los en cap fila, columna ni rectangle de 2 × 3.</p><div id="timer">02:00</div><table aria-label="Sudoku de 6 per 6"><tbody id="board"></tbody></table><button id="check">Comprovar resposta</button><p id="status" aria-live="polite"></p><small>El temps de 2 minuts comença en obrir la pàgina.</small></main><script>
const puzzle=[[1,0,0,4,0,6],[0,5,6,0,2,0],[2,0,4,0,6,0],[0,6,0,2,0,4],[3,0,5,0,1,0],[0,1,0,3,0,5]];
const solution=[[1,2,3,4,5,6],[4,5,6,1,2,3],[2,3,4,5,6,1],[5,6,1,2,3,4],[3,4,5,6,1,2],[6,1,2,3,4,5]];
const board=document.getElementById('board'),timer=document.getElementById('timer'),status=document.getElementById('status'),check=document.getElementById('check');let ended=false;const inputs=[];
for(let r=0;r<6;r++){const tr=document.createElement('tr');for(let c=0;c<6;c++){const td=document.createElement('td'),inp=document.createElement('input');inp.setAttribute('aria-label',`Fila ${r+1}, columna ${c+1}`);inp.setAttribute('inputmode','numeric');inp.setAttribute('maxlength','1');inp.dataset.row=r;inp.dataset.col=c;if(puzzle[r][c]){inp.value=puzzle[r][c];inp.readOnly=true;inp.className='fixed'}else{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^1-6]/g,'').slice(0,1)})}td.appendChild(inp);tr.appendChild(td);inputs.push(inp)}board.appendChild(tr)}
const start=Date.now();function end(msg){ended=true;inputs.forEach(x=>x.readOnly=true);check.disabled=true;status.textContent=msg;clearInterval(clock)}function tick(){if(ended)return;const remaining=Math.max(0,120-Math.floor((Date.now()-start)/1000));timer.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining===0)end('Temps esgotat! Repte no superat.')}const clock=setInterval(tick,200);tick();check.addEventListener('click',()=>{if(ended)return;const good=inputs.every(x=>Number(x.value)===solution[Number(x.dataset.row)][Number(x.dataset.col)]);if(good)end('🎉 Repte superat! 2 punts per al teu equip.');else status.textContent='Encara hi ha números incorrectes o caselles buides. Torna-ho a provar.'});
</script></body></html>
